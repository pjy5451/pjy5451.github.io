  - name: Cheongdam 1 Bridge
    key: cheongdam-1-bridge
    href: /field-sites/cheongdam-1-bridge/
    summary: Cloud-connected bridge monitoring using IoT sensing, acceleration-strain response review, and displacement-estimation workflows.
    location: Seoul, South Korea
    image: /images/field-sites/cheongdam-1-bridge/cheongdam-1-bridge-field-view.jpg
    field_focus: >-
      Cheongdam 1 Bridge was used as a real bridge field site for validating an IoT-based structural monitoring workflow under operating conditions. The monitoring work connected low-power sensing hardware, continuous response measurement, cloud-based data transfer, database management, and dashboard-based review for practical bridge response interpretation.
    period: Field deployment and review
    data_summary: Acceleration, strain, displacement-related response, sensor operation records, cloud transfer logs, dashboard review outputs, and engineering interpretation notes.
    equipment:
    - Low-power IoT sensing setup for bridge acceleration and strain response monitoring
    - Cloud-connected data transfer and storage workflow for continuous field records
    - Data-fusion workflow for indirect displacement-related response estimation from acceleration and strain measurements
    - Dashboard-based monitoring interface for reviewing sensor status and field response histories
    development_highlights:
    - Participated in field deployment and monitoring setup for an operating bridge environment
    - Supported integration of sensing hardware, communication modules, cloud transfer, database workflows, and dashboard visualization
    - Reviewed acceleration and strain response histories for long-term bridge monitoring interpretation
    - Worked with displacement-estimation concepts based on acceleration-strain data fusion and field response review
    validation_heading: Monitoring Workflow
    validation_protocol:
    - Field records are organized around the full monitoring chain, from sensor deployment and data acquisition to cloud transfer, database storage, and dashboard review.
    - Response interpretation focuses on acceleration, strain, and displacement-related behavior rather than isolated sensor readings.
    - System reliability is reviewed through sensor operation status, data-transfer continuity, and the practical usability of long-term monitoring records.
    field_context: >-
      Cheongdam 1 Bridge strengthens my portfolio by showing experience with long-term bridge monitoring beyond one-time field measurements. It connects structural engineering with IoT sensing, cloud-connected data management, and data-driven response interpretation for infrastructure monitoring under real service conditions.
    sites:
    - Cheongdam 1 Bridge
    data:
    - Long-term acceleration and strain response histories
    - Displacement-related response estimated through acceleration-strain data fusion workflows
    - Sensor operation, cloud transfer, database, and dashboard monitoring records
    result_groups:
    - title: Structural Response Review
      items:
      - Representative acceleration and strain time histories can show the bridge response captured under service conditions.
      - Displacement-estimation workflow figures can explain how multi-metric sensing supports bridge response interpretation.
    - title: Monitoring-System Operation
      items:
      - Dashboard screenshots can document data availability, sensor status, and long-term monitoring records.
      - System-operation summaries can show whether the sensing, communication, storage, and visualization chain remained usable in the field.
