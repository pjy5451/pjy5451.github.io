  - name: Choha-cheon Bridge
    key: choha-cheon-bridge
    href: /field-sites/choha-cheon-bridge/
    summary: QR-code-based data acquisition and repeated strain monitoring for a prefabricated bridge member lifecycle monitoring system.
    location: South Korea
    image: /images/field-sites/choha-cheon-bridge/choha-cheon-bridge-qr-monitoring.jpg
    field_focus: >-
      Choha-cheon Bridge was used as a lifecycle-monitoring field case for a prefabricated bridge member instrumented with embedded strain sensing. The monitoring workflow combined repeated field measurements, QR-code-based data access, and spreadsheet-based response review so that member behavior could be tracked beyond a single construction or inspection event.
    period: Long-term field monitoring
    date_range: 2022.10 - 2023.04
    data_summary: Eight-channel embedded strain-gauge records, thermometer readings, post-tensioning stage measurements, QR-code-based data acquisition records, and selected-channel monitoring histories.
    equipment:
    - Eight KM-100B embedded strain transducers installed across a prefabricated bridge member, with one thermometer channel recorded for field context
    - Gauge layout arranged across multiple section locations and web/flange positions for member-level response review
    - QR-code-based data acquisition interface used to retrieve field records during recurring measurements
    - Spreadsheet-based workflow for organizing direct readings, calculated stress values, and post-tensioning stage records
    equipment_figures:
    - image: /images/field-sites/choha-cheon-bridge/choha-cheon-gauge-layout.jpg
      alt: Choha-cheon Bridge embedded strain gauge layout
      caption: Embedded strain gauge layout for the prefabricated member, showing eight strain transducer positions and one thermometer channel across the member sections.
    development_highlights:
    - Implemented QR-linked field data access so recurring measurements could be collected and reviewed without a conventional fixed monitoring dashboard
    - Organized embedded strain-gauge records from installation and post-tensioning stages into lifecycle-oriented field records
    - Reviewed direct channel readings, calculated stress values, and thermometer records to track member response across repeated measurement dates
    - Connected field-friendly QR acquisition with long-term data management for prefabricated member monitoring
    validation_heading: Lifecycle Monitoring Workflow
    validation_protocol:
    - Field records are organized around the prefabricated member lifecycle, including initial readings, post-tensioning measurements, repeated field checks, and long-term response review.
    - QR-linked data capture is used to make field measurements accessible at the member level, supporting recurring inspection and data management.
    - Response histories are interpreted as monitoring records rather than final structural acceptance criteria unless the corresponding design or reference values are explicitly available.
    field_context: >-
      Choha-cheon Bridge is a useful lifecycle-monitoring example because it connects prefabricated-member instrumentation, QR-based field data retrieval, repeated strain measurement, and response-history management. It shows a practical monitoring workflow for structural components that need to be tracked across construction, prestressing, installation, and service-stage records.
    installation_figures:
    - image: /images/field-sites/choha-cheon-bridge/choha-cheon-strain-gauge-installation.jpg
      alt: Choha-cheon Bridge surface strain gauge installation
      caption: Field installation example of a strain gauge attached to a prefabricated concrete member during monitoring preparation.
    video:
      id: oE50q7iXPcs
      heading: System demonstration
      title: Choha-cheon Bridge QR-based data acquisition system demonstration
      caption: Demonstration of the QR-code-based data acquisition workflow used for prefabricated member lifecycle monitoring.
    sites:
    - Choha-cheon Bridge
    data:
    - Eight-channel embedded strain-gauge direct readings and calculated stress records
    - Post-tensioning stage records from November 2022 and selected follow-up measurements through April 2023
    - QR-code-based data acquisition records for field-friendly member-level monitoring
    - Thermometer channel records used as environmental context for the sensing data
    result_groups:
    - title: Strain Monitoring Records
      items:
      - Selected channel histories can show how repeated field measurements were organized across construction and early monitoring stages.
      - Direct readings and calculated stress values should be interpreted with the corresponding initial-value assumption and measurement stage.
    - title: QR-Based Field Data Access
      items:
      - QR scan outputs demonstrate how member-level field records were retrieved and reviewed without requiring a fixed on-site workstation.
      - The workflow supports lifecycle monitoring by linking physical member identification with recurring strain and temperature records.
    result_figures:
    - image: /images/field-sites/choha-cheon-bridge/choha-cheon-strain-monitoring-records.png
      alt: Choha-cheon Bridge selected strain channel monitoring records
      caption: Representative selected-channel records reconstructed from the Choha-cheon Bridge field sensing spreadsheet, showing repeated measurements between late 2022 and early 2023.
    - image: /images/field-sites/choha-cheon-bridge/choha-cheon-qr-data-capture.png
      alt: Choha-cheon Bridge QR-based data acquisition screen
      caption: QR-based data retrieval screen used for field-friendly access to member-level monitoring records.
      variant: compact
- title: Transportation and Specialized Field Tests
  sites:
  - name: WIM Field Tests
    key: wim-field-tests
    href: /field-sites/wim-field-tests/
    summary: Real-road validation of high-speed WIM sensing, vehicle-event detection, and vehicle-level monitoring records.
    location: Saemangeum / Bongdong, Jeonbuk, South Korea
    image: /images/field-sites/wim-field-tests/wim-field-test-roadside.jpg
    field_focus: >-
      The WIM field tests were conducted to validate high-speed Weigh-in-Motion sensing under real roadway conditions rather than controlled laboratory loading. The campaigns focused on capturing short-duration tire-sensor interactions from moving vehicles and converting raw roadway signals into interpretable vehicle-level records, including axle events, gross-weight estimates, passage timing, and reviewable monitoring outputs.
    period: Field validation tests
    data_summary: Multi-channel WIM signals, axle-event intervals, filtered signal records, vehicle-passage metadata, and validation review outputs.
    equipment:
    - Multi-channel roadway WIM sensor array installed across operational traffic lanes
    - Two-row load-sensing configuration used to compare repeated axle measurements from the same vehicle passage
    - Roadside vehicle-detection and image-acquisition workflow for associating WIM events with vehicle records
    - DAQ and database workflow for reviewing raw, filtered, and vehicle-level WIM records
    development_highlights:
    - Reviewed field installation conditions, sensor-channel mapping, signal quality, and vehicle-event acquisition under live traffic
    - Processed WIM signals using baseline correction, filtering, smoothing, event segmentation, and channel-level response checks
    - Analyzed axle peaks across multiple rows and channels to support axle-event matching and vehicle-passage interpretation
    - Linked signal records with vehicle speed, axle configuration, image records, and monitoring outputs where available
    - Prepared visualization and validation workflows for reviewing axle loads, gross vehicle weight, channel balance, timing differences, and abnormal waveforms
    validation_heading: Validation Workflow
    validation_protocol:
    - Field records are organized around the complete WIM monitoring path, from roadway installation and channel mapping to axle-event detection and vehicle-level record generation.
    - Representative passages are reviewed through raw signal acquisition, baseline correction, filtering, event segmentation, cross-row axle matching, and monitoring-record creation.
    - Validation outputs are separated into signal-quality review, vehicle-event interpretation, and reference-comparison results so exploratory waveform analysis is not presented as certified performance evidence.
    field_context: >-
      These tests show the field-facing side of my WIM research: connecting embedded roadway sensing, DAQ configuration, signal processing, vehicle-event detection, image-linked records, and dashboard-oriented review. The work supports data-driven infrastructure monitoring by turning real traffic loading into structured records that can be used for overload screening, traffic-load characterization, sensor-health review, and bridge or roadway load assessment.
    sites:
    - Saemangeum
    - Bongdong
    data:
    - Multi-channel WIM waveforms with detected axle-event intervals
    - Cross-row axle matching and timing-difference review between repeated sensor measurements
    - Channel response comparison for checking wheel-path effects, noise, drift, and abnormal signal shapes
    - Vehicle-level monitoring records combining WIM results, passage timing, vehicle information, and image-based review
    result_groups:
    - title: Signal Processing and Event Detection
      items:
      - Raw and filtered WIM signals can be used to show how short-duration wheel-load responses are segmented into axle events.
      - Cross-row axle matching can document timing consistency between repeated sensor measurements for the same vehicle passage.
    - title: Validation Results
      items:
      - Reference-weight comparison plots or compact validation tables should be added only for approved datasets and clearly labeled by test campaign.
      - Channel-health summaries can show noise, drift, abnormal waveforms, and response imbalance without overstating performance claims.
    - title: Operational Monitoring
      items:
      - Dashboard screenshots can connect passage time, vehicle image, speed, axle configuration, axle loads, gross weight, and system status into a single reviewable record.
      - A field-test video would be most useful if it synchronizes the vehicle crossing, WIM signals, detected axle events, and dashboard output.
  - name: OBM Field Validation
    key: obm-field-validation
    href: /field-sites/obm-field-validation/
    summary: Vehicle-mounted sensing validation for dynamic operating-weight estimation and WIM comparison.
    location: South Korea
    image: /images/field-sites/obm-field-validation/obm-vehicle-sensor-installation.jpg
    field_focus: >-
      The OBM field validation focused on evaluating an on-board monitoring system installed directly on a heavy vehicle. Unlike roadway WIM systems, which observe tire loads at a fixed road section, OBM records load-related vehicle responses during driving. The validation examined whether vehicle-mounted sensing could provide stable and interpretable operating-weight information under real driving, loading, and road-input conditions.
    period: Field validation tests
    data_summary: Vehicle-mounted sensor signals, IMU response, dynamic weight correction data, suspension-motion observations, and WIM-linked validation records.
    equipment:
    - Vehicle-mounted mass-sensing unit, inertial measurement unit, and electronic control unit for on-board data acquisition
    - Underbody installation with wiring, sensor attachment, and vehicle-side logging during repeated driving tests
    - Camera-based observation workflow for reviewing suspension or axle movement during selected runs
    - Validation workflow linking OBM records with roadside WIM measurements and known loading conditions where available
    development_highlights:
    - Supported vehicle sensor installation, cable routing, equipment checks, and pre-test inspection for field driving runs
    - Reviewed ECU and DAQ settings, channel definitions, timestamps, logging intervals, and data-storage formats
    - Preprocessed vehicle-mounted signals using filtering, offset removal, resampling, event segmentation, and invalid-data screening
    - Compared OBM responses across loading and driving conditions to evaluate repeatability, drift, dynamic variation, and speed-dependent behavior
    - Aligned OBM records with WIM vehicle passages to compare vehicle-side load estimates with roadway-based axle-load measurements
    - Reviewed relationships among mass-sensing signals, IMU response, suspension movement, vehicle speed, loading condition, and WIM reference records
    validation_heading: Validation Protocol
    validation_protocol:
    - Validation records are organized around vehicle instrumentation, loading condition, driving condition, reference measurement, and repeated field runs.
    - OBM, IMU, underbody video, and roadside WIM records are compared after passage matching, timestamp alignment, filtering, and stable-window selection.
    - Static mass, vehicle-mounted OBM estimates, and instantaneous roadside WIM axle forces are treated as related but distinct quantities during interpretation.
    field_context: >-
      This validation expands my field experience from fixed infrastructure sensing to vehicle-mounted monitoring. It connects sensor installation, embedded acquisition, vehicle dynamics, signal synchronization, video-based motion review, and WIM comparison around the same load-observation problem. Together with the WIM field tests, the OBM work supports a broader research direction in data-driven infrastructure evaluation under actual operating conditions.
    data:
    - Vehicle-mounted mass-sensing and inertial response signals collected during field driving tests
    - Load-condition and speed-dependent response comparisons across repeated runs
    - Time-aligned OBM and WIM records for the same vehicle passages
    - Suspension-motion observations and sensor-fusion review linking vehicle response with load-related measurements
    result_groups:
    - title: Multi-Sensor Signal Processing
      items:
      - Time-aligned OBM, IMU, speed, and vehicle-operation signals can show how load-related behavior is separated from acceleration, braking, vibration, and road excitation.
      - Underbody video frames and marker-tracking results can support physical interpretation of suspension or axle motion during selected runs.
    - title: Reference and Cross-System Validation
      items:
      - OBM estimates should be compared with static reference weights, roadside WIM records, or both, while clearly stating the physical meaning of each reference.
      - Matched OBM and WIM passages can show the same vehicle-road interaction from both vehicle-mounted and infrastructure-mounted sensing perspectives.
    - title: Test Matrix
      items:
      - A compact table should summarize vehicle configuration, loading condition, speed condition, road section, reference method, and repeated runs once those details are finalized.
      - Validation plots should distinguish approved performance metrics from exploratory signal-processing or synchronization checks.
  - name: Prefab Member Transportation Monitoring
    key: prefab-transportation-monitoring
    href: /field-sites/prefab-transportation-monitoring/
    summary: IoT-based monitoring for prefabricated structural members during lifting, hauling, and site delivery.
    location: South Korea
    image: /images/field-sites/prefab-transportation-monitoring/prefab-transportation-monitoring-setup.jpg
    field_focus: >-
      This field project focused on monitoring prefabricated structural members during transportation and handling, where the monitored object is a moving component rather than a fixed bridge or building. The work used field sensing to review vibration, tilt, strain, impact-related response, and movement-stage behavior during lifting, loading, hauling, and delivery.
    period: Field transportation monitoring
    data_summary: Transportation-stage acceleration, strain, tilt, route-linked movement records, handling-event response histories, and cloud monitoring records.
    equipment:
    - IoT sensor installation attached directly to prefabricated structural members during transport-related operations
    - Acceleration, strain, tilt, and impact-related response measurements for handling and hauling review
    - Base-station and cloud-connected monitoring workflow for collecting field data during moving operations
    - Route-linked monitoring concept for connecting structural response with transportation and delivery stages
    development_highlights:
    - Supported field application of IoT sensing to prefabricated members under practical lifting, loading, hauling, and delivery conditions
    - Reviewed temporary sensor attachment, field deployment constraints, and movement-stage data acquisition
    - Organized acceleration, strain, tilt, and handling-event records for transportation-stage response interpretation
    - Connected structural response data with movement-stage information to support field quality management and abnormal-event review
    validation_heading: Transportation Monitoring Workflow
    validation_protocol:
    - Field records are organized around transport stages such as lifting, loading, driving, unloading, and delivery.
    - Sensor response histories are interpreted together with route or movement information so that transport-induced events can be separated from stationary or handling conditions.
    - Result summaries should distinguish measured field response, stage identification, and abnormal-event review from final quality-control acceptance criteria.
    field_context: >-
      This entry expands my field portfolio beyond fixed bridge monitoring by showing how sensing systems can be applied to mobile structural assets during construction logistics. It connects structural engineering with practical field operations, where sensing, communication, and data interpretation must remain reliable while the monitored component is being moved.
    sites:
    - Prefab transportation route
    data:
    - Transportation-stage acceleration, strain, tilt, and impact-related response records
    - Movement-stage and handling-event histories during lifting, loading, hauling, and delivery
    - Route-linked monitoring records connecting transport movement with structural response
    result_groups:
    - title: Stage and Event Review
      items:
      - Multi-stage response plots can show how measured signals change during lifting, loading, driving, unloading, and delivery.
      - Event summaries can highlight abnormal vibration, impact, tilt, or support-condition changes once confirmed field criteria are available.
    - title: Cloud Monitoring Workflow
      items:
      - Dashboard screenshots can show how field sensor nodes, base-station communication, cloud storage, and response review are connected.
      - Route-linked records can help explain how transportation location and movement context are paired with structural response data.
