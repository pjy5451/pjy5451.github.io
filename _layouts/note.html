---
layout: default
---

<article class="note-page">
  <header class="note-page__header">
    <a class="note-page__back" href="{{ '/notes/' | relative_url }}">Notes</a>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.note_category %}<span class="note-archive__tag">{{ page.note_category }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
  </header>
  {% include note_gallery.html note=page %}
  <div class="note-page__content">
    {{ content }}
  </div>
</article>
