{% assign note = include.note %}
{% if note.images and note.images.size > 0 %}
  {% assign gallery_size = note.images.size %}
  <figure class="note-gallery" data-note-gallery>
    <div class="note-gallery__stage">
      {% for image in note.images %}
        <div class="note-gallery__slide" data-note-slide{% unless forloop.first %} hidden{% endunless %}>
          <img src="{{ image.src | relative_url }}" alt="{{ image.alt | default: note.title | escape }}" loading="lazy">
          {% if image.caption %}<figcaption>{{ image.caption }}</figcaption>{% endif %}
        </div>
      {% endfor %}
    </div>
    {% if gallery_size > 1 %}
      <div class="note-gallery__controls">
        <button type="button" data-note-gallery-prev aria-label="Previous photograph" title="Previous photograph">&larr;</button>
        <span><b data-note-gallery-current>1</b> / {{ gallery_size }}</span>
        <button type="button" data-note-gallery-next aria-label="Next photograph" title="Next photograph">&rarr;</button>
      </div>
    {% endif %}
  </figure>
{% elsif note.thumbnail %}
  <figure class="note-gallery">
    <div class="note-gallery__stage">
      <div class="note-gallery__slide">
        <img src="{{ note.thumbnail | relative_url }}" alt="{{ note.thumbnail_alt | default: note.title | escape }}" loading="lazy">
      </div>
    </div>
  </figure>
{% endif %}
